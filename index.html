<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PDF Slicer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    h1 {
      margin-bottom: 0.2rem;
    }

    .subtitle {
      color: #555;
      margin-top: 0;
    }

    .privacy-note {
      margin-top: 2rem;
      padding: 1rem;
      background: #f3f3f3;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>PDF Slicer</h1>

  <p class="subtitle">
    Slice large-format PDF posters into printable pages.
  </p>

  <p>
    This tool will process PDF files entirely inside your browser.
  </p>

  <div class="privacy-note">
    <strong>Privacy:</strong>
    Your PDF will not be uploaded to a server.
  </div>
</body>
</html>
