<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PDF Slicer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    h1 {
      margin-bottom: 0.2rem;
    }

    .subtitle {
      color: #555;
      margin-top: 0;
    }

    .upload-box {
      margin-top: 2rem;
      padding: 2rem;
      border: 2px dashed #999;
      border-radius: 10px;
      text-align: center;
    }

    input[type="file"] {
      margin-top: 1rem;
    }

    .file-info {
      margin-top: 1rem;
      font-weight: bold;
    }

    .privacy-note {
      margin-top: 2rem;
      padding: 1rem;
      background: #f3f3f3;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>PDF Slicer</h1>

  <p class="subtitle">
    Slice large-format PDF posters into printable pages.
  </p>

  <div class="upload-box">
    <strong>Select a PDF poster</strong>

    <br />

    <input
      id="pdfInput"
      type="file"
      accept="application/pdf"
    />

    <div id="fileInfo" class="file-info"></div>
  </div>

  <div class="privacy-note">
    <strong>Privacy:</strong>
    Your PDF is processed locally in your browser and is not uploaded
    to a server.
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
   <script>
    const pdfInput = document.getElementById("pdfInput");
    const fileInfo = document.getElementById("fileInfo");
  
    const POINTS_PER_MM = 72 / 25.4;
  
    function pointsToMillimeters(points) {
      return points / POINTS_PER_MM;
    }
  
    pdfInput.addEventListener("change", async () => {
      const file = pdfInput.files[0];
  
      if (!file) {
        fileInfo.textContent = "";
        return;
      }
  
      if (
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
      ) {
        fileInfo.textContent = "Please select a PDF file.";
        pdfInput.value = "";
        return;
      }
  
      try {
        fileInfo.textContent = "Reading PDF locally...";
  
        const arrayBuffer = await file.arrayBuffer();
  
        const pdfDocument = await PDFLib.PDFDocument.load(arrayBuffer);
  
        const pageCount = pdfDocument.getPageCount();
        const firstPage = pdfDocument.getPage(0);
  
        const widthPoints = firstPage.getWidth();
        const heightPoints = firstPage.getHeight();
  
        const widthMM = pointsToMillimeters(widthPoints);
        const heightMM = pointsToMillimeters(heightPoints);
  
        const orientation =
          widthMM > heightMM ? "Landscape" : "Portrait";
  
        const sizeMB = file.size / (1024 * 1024);
  
        fileInfo.innerHTML = `
          <div>Selected: ${file.name}</div>
          <div>File size: ${sizeMB.toFixed(2)} MB</div>
          <div>PDF pages: ${pageCount}</div>
          <div>
            First-page size:
            ${widthMM.toFixed(1)} × ${heightMM.toFixed(1)} mm
          </div>
          <div>Orientation: ${orientation}</div>
        `;
      } catch (error) {
        console.error(error);
  
        fileInfo.textContent =
          "The PDF could not be read. It may be damaged, encrypted, or unsupported.";
      }
    });
  </script>
</body>
</html>
