<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PDF Slicer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    h1 {
      margin-bottom: 0.2rem;
    }

    .subtitle {
      color: #555;
      margin-top: 0;
    }

    .upload-box {
      margin-top: 2rem;
      padding: 2rem;
      border: 2px dashed #999;
      border-radius: 10px;
      text-align: center;
    }

    input[type="file"] {
      margin-top: 1rem;
    }

    .file-info {
      margin-top: 1rem;
      font-weight: bold;
    }

    .privacy-note {
      margin-top: 2rem;
      padding: 1rem;
      background: #f3f3f3;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>PDF Slicer</h1>

  <p class="subtitle">
    Slice large-format PDF posters into printable pages.
  </p>

  <div class="upload-box">
    <strong>Select a PDF poster</strong>

    <br />

    <input
      id="pdfInput"
      type="file"
      accept="application/pdf"
    />

    <div id="fileInfo" class="file-info"></div>
  </div>

  <div class="privacy-note">
    <strong>Privacy:</strong>
    Your PDF is processed locally in your browser and is not uploaded
    to a server.
  </div>

  <script>
    const pdfInput = document.getElementById("pdfInput");
    const fileInfo = document.getElementById("fileInfo");

    pdfInput.addEventListener("change", () => {
      const file = pdfInput.files[0];

      if (!file) {
        fileInfo.textContent = "";
        return;
      }

      if (file.type !== "application/pdf") {
        fileInfo.textContent = "Please select a PDF file.";
        pdfInput.value = "";
        return;
      }

      const sizeMB = file.size / (1024 * 1024);

      fileInfo.textContent =
        `Selected: ${file.name} (${sizeMB.toFixed(2)} MB)`;
    });
  </script>
</body>
</html>
